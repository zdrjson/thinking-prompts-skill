<title>十二个思考 Prompt</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F3EE; --surface:#FBFCF9; --line:#D3DACE; --grid:#DCE4D8;
  --ink:#1A221C; --ink2:#4B564D; --ink3:#6F7A71;
  --accent:#2E6B4C; --accent-soft:rgba(46,107,76,.10);
  --slot:#B5372B; --slot-bg:rgba(181,55,43,.07); --slot-line:rgba(181,55,43,.35);
  --shadow:0 1px 2px rgba(26,34,28,.06),0 8px 24px -12px rgba(26,34,28,.18);
  --serif:"Noto Serif SC",Songti SC,SimSun,Georgia,serif;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12160F; --surface:#191E17; --line:#2D352C; --grid:#232B22;
  --ink:#E5EAE1; --ink2:#A6B0A4; --ink3:#7C877B;
  --accent:#6FBF92; --accent-soft:rgba(111,191,146,.13);
  --slot:#F0857A; --slot-bg:rgba(240,133,122,.11); --slot-line:rgba(240,133,122,.42);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#12160F; --surface:#191E17; --line:#2D352C; --grid:#232B22;
  --ink:#E5EAE1; --ink2:#A6B0A4; --ink3:#7C877B;
  --accent:#6FBF92; --accent-soft:rgba(111,191,146,.13);
  --slot:#F0857A; --slot-bg:rgba(240,133,122,.11); --slot-line:rgba(240,133,122,.42);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--paper)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;padding:44px 0 26px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.2vw,40px);line-height:1.2;
  margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .num{color:var(--accent)}
.langsw{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  margin-left:auto;align-self:center}
.langsw button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:6px 13px;
  border:0;background:var(--surface);color:var(--ink3);cursor:pointer;transition:all .13s}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.langsw button:not([aria-pressed="true"]):hover{color:var(--ink)}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);padding-bottom:6px}
.lede{max-width:62ch;margin:14px 0 0;color:var(--ink2);font-size:15px}
.lede code{font-family:var(--serif);color:var(--slot);font-size:15px}

/* routing note */
.route{display:flex;gap:14px;margin:22px 0 30px;padding:16px 18px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px}
.route .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);
  text-transform:uppercase;white-space:nowrap;padding-top:3px}
.route p{margin:0;font-size:14px;color:var(--ink2);line-height:1.85}
.route b{color:var(--ink);font-weight:500}

/* layout */
main{display:grid;grid-template-columns:288px 1fr;gap:56px;align-items:start;padding-bottom:80px}
nav{position:sticky;top:20px}
.grp{margin-bottom:22px}
.grp>h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 8px;padding-left:2px;font-weight:500}
.item{display:grid;grid-template-columns:26px 1fr;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:7px 10px 7px 2px;border-radius:2px;cursor:pointer;
  font-family:inherit;color:var(--ink);transition:background .13s}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item[aria-current="true"] .nm{color:var(--accent)}
.item .no{font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:3px;
  font-variant-numeric:tabular-nums}
.item[aria-current="true"] .no{color:var(--accent)}
.item .nm{display:block;font-size:15px;font-weight:500;line-height:1.5}
.item .wh{display:block;font-size:12.5px;color:var(--ink3);line-height:1.55;margin-top:1px}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* workbench */
article{min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:flex;gap:10px;align-items:center}
.eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
h3{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:700;margin:10px 0 0;
  line-height:1.3;text-wrap:balance}
.when{margin:8px 0 0;color:var(--ink2);font-size:15.5px}

.sheet{position:relative;margin:26px 0 0;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;box-shadow:var(--shadow)}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 20px;border-bottom:1px solid var(--line)}
.sheet-hd .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3)}
.slotcount{font-family:var(--mono);font-size:11px;color:var(--slot);letter-spacing:.06em}
.hd-r{display:flex;align-items:center;gap:14px}
.icopy{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  border-radius:2px;background:var(--paper);color:var(--ink2);cursor:pointer;transition:all .13s}
.icopy:hover{color:var(--accent);border-color:var(--accent)}
.icopy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icopy svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.body{padding:20px 24px 24px;font-size:16px;line-height:34px;white-space:pre-wrap;word-break:break-word;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--grid) 33px 34px);
  background-position:0 20px;background-repeat:repeat}
.slot{display:inline;color:var(--slot);background:var(--slot-bg);
  box-shadow:inset 0 -1px 0 var(--slot-line);padding:0 .22em;border-radius:1px;
  outline:none;line-height:inherit;min-width:2em}
.slot:focus{background:var(--slot-bg);box-shadow:inset 0 -2px 0 var(--slot)}
.slot:empty::before{content:"【" attr(data-ph) "】";color:var(--slot);opacity:.6}
.slot::selection{background:var(--slot);color:var(--surface)}

/* actions */
.bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 0 20px;background:linear-gradient(to bottom,transparent,var(--paper) 26%)}
.btn{font-family:inherit;font-size:14.5px;font-weight:500;padding:10px 20px;border-radius:2px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .13s}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--ink3);font-family:var(--mono);letter-spacing:.02em}

.note{display:grid;grid-template-columns:auto 1fr;gap:14px;margin:26px 0 0;padding:16px 18px;
  border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.note .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap;padding-top:3px}
.note p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.8}

footer{border-top:1px solid var(--line);padding:26px 0 44px;font-size:13.5px;color:var(--ink3)}
footer p{margin:0 0 6px;max-width:70ch}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);opacity:0;
  pointer-events:none;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:2px;
  font-size:14px;transition:opacity .18s,transform .18s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:920px){
  main{grid-template-columns:1fr;gap:26px}
  nav{position:static}
  .grp{margin-bottom:16px}
  .head{padding:32px 0 20px}
  .body{padding:16px 16px 20px;background-position:0 16px}
  .wrap{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap">
  <div class="head">
    <h1 id="h1"></h1>
    <span class="tag" id="tag"></span>
    <div class="langsw" role="group" aria-label="Language">
      <button id="lz" aria-pressed="true">中文</button><button id="le" aria-pressed="false">EN</button>
    </div>
  </div>
  <p class="lede" id="lede"></p>
  <div class="route"><span class="k" id="routek"></span><p id="route"></p></div>
</div></header>

<div class="wrap"><main>
  <nav id="nav"></nav>
  <article id="work"></article>
</main></div>

<footer><div class="wrap">
  <p id="src"></p>
  <p id="foot2"></p>
</div></footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = __PROMPT_DATA__;

const T = {
 zh:{title:'<span class="num">12</span> 个思考 Prompt',
     tag:'问清问题 · 学习 · 解决问题 · 决策 · 认识自己',
     lede:'不用装任何东西，任何 AI 都能用。选一个场景，直接在正文里把 <code>【】</code> 填掉，然后复制走。手头有材料就一起贴上去——这些框架吃上下文，说得越具体，结果差得越远。',
     routek:'先分流', navLabel:'框架索引', when:'什么时候用：', sheet:'PROMPT 正文',
     slots:n=>n+' 处填空 · 点红字直接改', noslot:'无需填空', copy:'复制', copyBig:'复制 Prompt',
     note:'要点', openIn:x=>'在 '+x+' 打开', copyOpen:x=>'复制并打开 '+x,
     tooLong:'这条太长，走剪贴板', copied:'已复制，贴进任意 AI 就能用',
     selected:m=>'已为你选中，按 '+m+' 复制',
     src:(a,u,t)=>'框架蒸馏自 '+a+'《<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>》，Prompt 原文版权归原作者所有。',
     foot2:'网页版把 <code>【】</code> 做成了可直接编辑的填空位，复制出去的是你填完的版本。同一套框架另有 MCP server、AGENTS.md、Cursor rules 和 Claude Skill 四种接入方式，见 <a href="'+DATA.repo+'" target="_blank" rel="noopener">仓库</a>。'},
 en:{title:'<span class="num">12</span> Thinking Prompts',
     tag:'ASK · LEARN · SOLVE · DECIDE · KNOW YOURSELF',
     lede:'Nothing to install — works with any AI. Pick a situation, fill the <code>【】</code> blanks right in the text, then copy it out. Paste in whatever material you have: these frameworks run on context, and the more specific you are the further the results diverge.',
     routek:'START HERE', navLabel:'Framework index', when:'When to use: ', sheet:'PROMPT',
     slots:n=>n+(n>1?' blanks':' blank')+' · click the red text', noslot:'no blanks to fill',
     copy:'COPY', copyBig:'Copy prompt', note:'NOTE',
     openIn:x=>'Open in '+x, copyOpen:x=>'Copy & open '+x,
     tooLong:'too long for a URL — via clipboard', copied:'Copied — paste it into any AI',
     selected:m=>'Selected for you — press '+m+' to copy',
     src:(a,u,t)=>'Frameworks distilled from '+a+', <a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>. Prompt text remains the original author\'s.',
     foot2:'This page turns every <code>【】</code> into an editable blank, so what you copy is the version you filled in. The same frameworks also ship as an MCP server, AGENTS.md, Cursor rules and a Claude Skill — see the <a href="'+DATA.repo+'" target="_blank" rel="noopener">repo</a>.'}
};

let L = (location.search.match(/lang=(en|zh)/)||[])[1]
     || localStorage.getItem('tp-lang')
     || (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
if((location.search.match(/lang=(en|zh)/)||[])[1]) L=(location.search.match(/lang=(en|zh)/))[1];
else if(localStorage.getItem('tp-lang')) L=localStorage.getItem('tp-lang');
else L=(navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en';

const F=(p,k)=> L==='en' ? (p[k+'_en']||p[k]) : p[k];
const nav=document.getElementById('nav'), work=document.getElementById('work'),
      toast=document.getElementById('toast');
const fills={}; let cur=DATA.prompts[0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chrome(){
  const t=T[L];
  document.documentElement.lang = L==='en'?'en':'zh-CN';
  document.getElementById('h1').innerHTML=t.title;
  document.getElementById('tag').textContent=t.tag;
  document.getElementById('lede').innerHTML=t.lede;
  document.getElementById('routek').textContent=t.routek;
  document.getElementById('route').innerHTML=(L==='en'?DATA.routing_en:DATA.routing)
    .replace(/「([^」]+)」/g,'<b>「$1」</b>').replace(/"([^"]+)"/g,'<b>"$1"</b>');
  nav.setAttribute('aria-label',t.navLabel);
  const s=DATA.source;
  document.getElementById('src').innerHTML=t.src(
    L==='en'?s.author_en:s.author, s.url, L==='en'?s.title_en:s.title);
  document.getElementById('foot2').innerHTML=t.foot2;
  document.title = L==='en' ? DATA.title_en : DATA.title;
  document.getElementById('lz').setAttribute('aria-pressed', L==='zh');
  document.getElementById('le').setAttribute('aria-pressed', L==='en');
}

function rail(){
  const groups=[];
  DATA.prompts.forEach(p=>{
    let g=groups.find(x=>x.n===p.group);
    if(!g) groups.push(g={n:p.group,name:F(p,'groupName'),items:[]});
    g.items.push(p);
  });
  nav.innerHTML=groups.map(g=>'<section class="grp"><h2>'+g.n+' / '+esc(g.name)+'</h2>'
    +g.items.map(p=>'<button class="item" data-id="'+p.id+'"><span class="no">'
      +String(p.n).padStart(2,'0')+'</span><span><span class="nm">'+esc(F(p,'name'))
      +'</span><span class="wh">'+esc(F(p,'when'))+'</span></span></button>').join('')
    +'</section>').join('');
  [...nav.querySelectorAll('.item')].forEach(b=>
    b.setAttribute('aria-current', b.dataset.id===cur.id ? 'true':'false'));
}
nav.addEventListener('click',e=>{const b=e.target.closest('.item'); if(b) location.hash=b.dataset.id;});

function parts(body){
  const out=[]; const re=/【([^】]*)】/g; let last=0,m;
  while((m=re.exec(body))){
    if(m.index>last) out.push({t:'txt',v:body.slice(last,m.index)});
    out.push({t:'slot',v:m[1]}); last=re.lastIndex;
  }
  if(last<body.length) out.push({t:'txt',v:body.slice(last)});
  return out;
}

function render(p){
  cur=p; const t=T[L];
  const ps=parts(F(p,'body')), n=ps.filter(x=>x.t==='slot').length;
  const key=p.id+'|'+L, saved=fills[key]||[];
  let si=-1;
  const html=ps.map(x=>{
    if(x.t==='txt') return esc(x.v);
    si++;
    return '<span class="slot" contenteditable="plaintext-only" data-ph="'+esc(x.v)
      +'" data-i="'+si+'" role="textbox" aria-label="'+esc(x.v)+'">'+esc(saved[si]||'')+'</span>';
  }).join('');

  work.innerHTML=
   '<div class="eyebrow"><span>'+p.group+' / '+esc(F(p,'groupName'))+'</span><span class="dot"></span>'
     +'<span>NO.'+String(p.n).padStart(2,'0')+'</span></div>'
   +'<h3>'+esc(F(p,'name'))+'</h3><p class="when">'+t.when+esc(F(p,'when'))+'</p>'
   +'<div class="sheet"><div class="sheet-hd"><span class="lbl">'+t.sheet+'</span>'
     +'<span class="hd-r"><span class="slotcount">'+(n?t.slots(n):t.noslot)+'</span>'
     +'<button class="icopy" id="icopy"><svg viewBox="0 0 16 16">'
     +'<rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.4"/>'
     +'<path d="M10.8 5.2V3.9c0-.8-.6-1.4-1.4-1.4H3.9c-.8 0-1.4.6-1.4 1.4v5.5c0 .8.6 1.4 1.4 1.4h1.3"/>'
     +'</svg>'+t.copy+'</button></span></div>'
   +'<div class="body" id="body">'+html+'</div></div>'
   +'<div class="bar"><button class="btn pri" id="copy">'+t.copyBig+'</button>'
     +'<a class="btn" id="gpt" target="_blank" rel="noopener"></a>'
     +'<a class="btn" id="cl" target="_blank" rel="noopener"></a>'
     +'<span class="hint" id="hint"></span></div>'
   +'<div class="note"><span class="k">'+t.note+'</span><p>'+esc(F(p,'note'))+'</p></div>';

  document.querySelectorAll('.slot').forEach(s=>{
    s.addEventListener('input',()=>{(fills[key]||(fills[key]=[]))[+s.dataset.i]=s.textContent; links();});
    s.addEventListener('paste',ev=>{ev.preventDefault();
      document.execCommand('insertText',false,(ev.clipboardData||window.clipboardData).getData('text'));});
  });
  document.getElementById('copy').addEventListener('click',()=>copy());
  document.getElementById('icopy').addEventListener('click',()=>copy());
  links();
  [...nav.querySelectorAll('.item')].forEach(b=>
    b.setAttribute('aria-current', b.dataset.id===p.id ? 'true':'false'));
}

function text(){
  let out='';
  document.getElementById('body').childNodes.forEach(nd=>{
    if(nd.nodeType===3) out+=nd.nodeValue;
    else if(nd.classList&&nd.classList.contains('slot'))
      out+= nd.textContent.trim() ? nd.textContent : '【'+nd.dataset.ph+'】';
  });
  return out;
}

const LIMIT=7800;
function links(){
  const t=T[L], enc=encodeURIComponent(text()), fits=enc.length<=LIMIT;
  const gpt=document.getElementById('gpt'), cl=document.getElementById('cl'),
        hint=document.getElementById('hint');
  if(fits){
    gpt.href='https://chatgpt.com/?q='+enc; gpt.textContent=t.openIn('ChatGPT');
    cl.href='https://claude.ai/new?q='+enc; cl.textContent=t.openIn('Claude');
    gpt.onclick=cl.onclick=null; hint.textContent='';
  }else{
    gpt.href='https://chatgpt.com/'; gpt.textContent=t.copyOpen('ChatGPT');
    cl.href='https://claude.ai/new'; cl.textContent=t.copyOpen('Claude');
    gpt.onclick=cl.onclick=()=>copy(); hint.textContent=t.tooLong;
  }
}

async function write(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta=document.createElement('textarea');
  ta.value=t; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:-9999px';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function copy(){
  if(await write(text())) return say(T[L].copied);
  const blanks=[...document.querySelectorAll('.slot')].filter(s=>!s.textContent.trim());
  blanks.forEach(s=>{s.textContent='【'+s.dataset.ph+'】'});
  const sel=getSelection(), rg=document.createRange();
  rg.selectNodeContents(document.getElementById('body'));
  sel.removeAllRanges(); sel.addRange(rg);
  const restore=()=>{blanks.forEach(s=>{if(s.textContent==='【'+s.dataset.ph+'】') s.textContent='';});
    removeEventListener('pointerdown',restore); removeEventListener('keydown',restore);};
  addEventListener('copy',()=>setTimeout(restore,0),{once:true});
  addEventListener('pointerdown',restore); addEventListener('keydown',restore);
  say(T[L].selected(/Mac|iP(hone|ad)/.test(navigator.platform)?'\u2318C':'Ctrl+C'));
}
let tid;
function say(m){ toast.textContent=m; toast.classList.add('on');
  clearTimeout(tid); tid=setTimeout(()=>toast.classList.remove('on'),2200); }

function setLang(l){
  if(l===L) return;
  L=l; localStorage.setItem('tp-lang',l);
  chrome(); rail(); render(cur);
}
document.getElementById('lz').addEventListener('click',()=>setLang('zh'));
document.getElementById('le').addEventListener('click',()=>setLang('en'));

addEventListener('hashchange',()=>{
  const p=DATA.prompts.find(x=>x.id===location.hash.slice(1));
  if(p){ render(p); work.scrollIntoView({block:'start',
    behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); }
});
chrome(); rail();
render(DATA.prompts.find(x=>x.id===location.hash.slice(1))||DATA.prompts[0]);
</script>
