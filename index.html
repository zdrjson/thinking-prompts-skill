<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="12 个可直接复制的思考 Prompt，任何 AI 都能用。框架蒸馏自卡兹克《都Agent时代了，我还是想分享给你这12个我最常用的Prompt。》 https://mp.weixin.qq.com/s/NAdhdFrUq9-BKelqzqpwBQ">
<title>十二个思考 Prompt</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F3EE; --surface:#FBFCF9; --line:#D3DACE; --grid:#DCE4D8;
  --ink:#1A221C; --ink2:#4B564D; --ink3:#6F7A71;
  --accent:#2E6B4C; --accent-soft:rgba(46,107,76,.10);
  --slot:#B5372B; --slot-bg:rgba(181,55,43,.07); --slot-line:rgba(181,55,43,.35);
  --shadow:0 1px 2px rgba(26,34,28,.06),0 8px 24px -12px rgba(26,34,28,.18);
  --serif:"Noto Serif SC",Songti SC,SimSun,Georgia,serif;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12160F; --surface:#191E17; --line:#2D352C; --grid:#232B22;
  --ink:#E5EAE1; --ink2:#A6B0A4; --ink3:#7C877B;
  --accent:#6FBF92; --accent-soft:rgba(111,191,146,.13);
  --slot:#F0857A; --slot-bg:rgba(240,133,122,.11); --slot-line:rgba(240,133,122,.42);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#12160F; --surface:#191E17; --line:#2D352C; --grid:#232B22;
  --ink:#E5EAE1; --ink2:#A6B0A4; --ink3:#7C877B;
  --accent:#6FBF92; --accent-soft:rgba(111,191,146,.13);
  --slot:#F0857A; --slot-bg:rgba(240,133,122,.11); --slot-line:rgba(240,133,122,.42);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--paper)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px;padding:44px 0 26px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.2vw,40px);line-height:1.2;
  margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .num{color:var(--accent)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);padding-bottom:6px}
.lede{max-width:62ch;margin:14px 0 0;color:var(--ink2);font-size:15px}
.lede code{font-family:var(--serif);color:var(--slot);font-size:15px}

/* routing note */
.route{display:flex;gap:14px;margin:22px 0 30px;padding:16px 18px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px}
.route .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);
  text-transform:uppercase;white-space:nowrap;padding-top:3px}
.route p{margin:0;font-size:14px;color:var(--ink2);line-height:1.85}
.route b{color:var(--ink);font-weight:500}

/* layout */
main{display:grid;grid-template-columns:288px 1fr;gap:56px;align-items:start;padding-bottom:80px}
nav{position:sticky;top:20px}
.grp{margin-bottom:22px}
.grp>h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 8px;padding-left:2px;font-weight:500}
.item{display:grid;grid-template-columns:26px 1fr;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:7px 10px 7px 2px;border-radius:2px;cursor:pointer;
  font-family:inherit;color:var(--ink);transition:background .13s}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item[aria-current="true"] .nm{color:var(--accent)}
.item .no{font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:3px;
  font-variant-numeric:tabular-nums}
.item[aria-current="true"] .no{color:var(--accent)}
.item .nm{display:block;font-size:15px;font-weight:500;line-height:1.5}
.item .wh{display:block;font-size:12.5px;color:var(--ink3);line-height:1.55;margin-top:1px}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* workbench */
article{min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:flex;gap:10px;align-items:center}
.eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
h3{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:700;margin:10px 0 0;
  line-height:1.3;text-wrap:balance}
.when{margin:8px 0 0;color:var(--ink2);font-size:15.5px}

.sheet{position:relative;margin:26px 0 0;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;box-shadow:var(--shadow)}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 20px;border-bottom:1px solid var(--line)}
.sheet-hd .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3)}
.slotcount{font-family:var(--mono);font-size:11px;color:var(--slot);letter-spacing:.06em}
.hd-r{display:flex;align-items:center;gap:14px}
.icopy{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  border-radius:2px;background:var(--paper);color:var(--ink2);cursor:pointer;transition:all .13s}
.icopy:hover{color:var(--accent);border-color:var(--accent)}
.icopy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icopy svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.body{padding:20px 24px 24px;font-size:16px;line-height:34px;white-space:pre-wrap;word-break:break-word;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--grid) 33px 34px);
  background-position:0 20px;background-repeat:repeat}
.slot{display:inline;color:var(--slot);background:var(--slot-bg);
  box-shadow:inset 0 -1px 0 var(--slot-line);padding:0 .22em;border-radius:1px;
  outline:none;line-height:inherit;min-width:2em}
.slot:focus{background:var(--slot-bg);box-shadow:inset 0 -2px 0 var(--slot)}
.slot:empty::before{content:"【" attr(data-ph) "】";color:var(--slot);opacity:.6}
.slot::selection{background:var(--slot);color:var(--surface)}

/* actions */
.bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 0 20px;background:linear-gradient(to bottom,transparent,var(--paper) 26%)}
.btn{font-family:inherit;font-size:14.5px;font-weight:500;padding:10px 20px;border-radius:2px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .13s}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--ink3);font-family:var(--mono);letter-spacing:.02em}

.note{display:grid;grid-template-columns:auto 1fr;gap:14px;margin:26px 0 0;padding:16px 18px;
  border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.note .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap;padding-top:3px}
.note p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.8}

footer{border-top:1px solid var(--line);padding:26px 0 44px;font-size:13.5px;color:var(--ink3)}
footer p{margin:0 0 6px;max-width:70ch}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);opacity:0;
  pointer-events:none;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:2px;
  font-size:14px;transition:opacity .18s,transform .18s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:920px){
  main{grid-template-columns:1fr;gap:26px}
  nav{position:static}
  .grp{margin-bottom:16px}
  .head{padding:32px 0 20px}
  .body{padding:16px 16px 20px;background-position:0 16px}
  .wrap{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap">
  <div class="head">
    <h1><span class="num">12</span> 个思考 Prompt</h1>
    <span class="tag">问清问题 · 学习 · 解决问题 · 决策 · 认识自己</span>
  </div>
  <p class="lede">不用装任何东西，任何 AI 都能用。选一个场景，直接在正文里把 <code>【】</code> 填掉，然后复制走。手头有材料就一起贴上去——这些框架吃上下文，说得越具体，结果差得越远。</p>
  <div class="route"><span class="k">先分流</span><p id="route"></p></div>
</div></header>

<div class="wrap"><main>
  <nav id="nav" aria-label="框架索引"></nav>
  <article id="work"></article>
</main></div>

<footer><div class="wrap">
  <p id="src"></p>
  <p>网页版把 <code>【】</code> 做成了可直接编辑的填空位，复制出去的是你填完的版本。同一套框架另有 MCP server、AGENTS.md、Cursor rules 和 Claude Skill 四种接入方式，见 <a id="repo" href="#">仓库</a>。</p>
</div></footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = {"title": "十二个思考 Prompt", "source": {"title": "都Agent时代了，我还是想分享给你这12个我最常用的Prompt。", "author": "卡兹克", "url": "https://mp.weixin.qq.com/s/NAdhdFrUq9-BKelqzqpwBQ"}, "repo": "https://github.com/zdrjson/thinking-prompts-skill", "routing": "问题模糊 → 先跑 1，再跑别的。问题清楚但没知识 → 2～5。知识够但方案卡住 → 6～8。方案有了但选不出来 → 9～10。反复纠结同一件事、每次结论都不一样 → 大概率是 11～12 的问题，不是 9～10：决策工具治不了「我不知道自己要什么」。", "prompts": [{"n": 1, "group": 1, "groupName": "问清问题", "id": "socratic", "name": "苏格拉底式提问", "when": "你知道自己卡住了，但说不清到底卡在哪", "note": "它解决的是「我究竟想问的本质问题是什么」。中途 AI 要是忍不住给建议，你就会顺着建议回答，问诊就废了——拉回来让它继续问。", "body": "我的困惑是：【尽量具体地描述发生了什么、你怎么理解，以及你卡在哪里】。先不要给建议。请对我进行一次苏格拉底式问诊，通过最多6个问题，帮我找到真正值得回答的问题。\n\n请遵守这些规则：1. 每次只问一个问题，根据我的回答决定下一问，不要提前给我一整套问卷；2. 优先区分我说的是可验证的事实、对事实的解释、价值判断，还是我希望实现的目标；3. 检查关键词是否含糊、我默认了哪些前提、证据来自哪里、有没有相反解释，以及结论成立或不成立分别意味着什么；4. 每次提问前，用一句话说明上一条回答让你更新了什么判断；5. 只问可能改变结论的问题。信息足够时立刻停止，不必凑满6个。\n\n问诊结束后，请整理出：1. 我最开始问的问题；2. 我真正想解决的问题；3. 已经确认的事实；4. 仍未验证的假设；5. 最可能改变结论的关键变量；6. 一个准确、具体、可以继续行动的新问题。\n\n等我确认这个新问题以后，再给出你的判断、理由和下一步行动。"}, {"n": 2, "group": 2, "groupName": "学习", "id": "two-layer", "name": "双层解释法", "when": "这个概念我完全听不懂", "note": "「把我当小学生解释」容易停在「好像懂了」——类比记住了，机制还是一团雾。两层一起给才补得上。", "body": "我想学习的是：【填写概念或问题】。\n\n请分两层解释：\n第一层，小白版。用生活化的语言和一个具体例子，让完全没有基础的人也能听懂。\n第二层，专业版。使用准确术语，讲清核心机制、适用边界和常见误解。\n\n最后请整理出：1. 列出小白说法与专业术语的对应关系；2. 我最容易理解错的地方；3. 3个用于检查我是否真正理解的问题。"}, {"n": 3, "group": 2, "groupName": "学习", "id": "reverse-engineer", "name": "反向拆解", "when": "这东西做得真好，我想学它", "note": "第 5 条最容易被跳过。必须让它明说哪些细节只适合原案例，不然你会把不可迁移的东西照搬走。", "body": "我想拆解的优秀范例是：【粘贴产品页面、网页、方案、流程说明、数据看板或其他成品】。我想学会的是：【填写你希望从中学会什么】。\n\n请先用一句话说明它解决了什么问题，再反向拆解它为什么有效。\n\n重点分析：1. 它服务谁，目标是什么；2. 它采用了什么结构或流程；3. 哪些关键选择拉开了质量差距；4. 它的完成标准是什么；5. 哪些规律可以迁移，哪些细节只适合这个案例。\n\n最后请给我：1. 提炼3到5条可复用规律；2. 一份可以照着执行的操作清单；3. 一个最值得先尝试的小练习。"}, {"n": 4, "group": 2, "groupName": "学习", "id": "vertical-horizontal", "name": "横纵分析法", "when": "我想系统搞懂某个陌生领域", "note": "配合「深度研究 / Deep Research」模式用才是满血版。字数按需要改——只想半小时建个框架，把结尾改成 3000～5000 字，别让它为凑字数堆资料。", "body": "研究对象是：【填写产品、公司、人物、技术、行业或事件】。\n\n请使用横纵分析法，对它完成一份可追溯的深度研究。研究截止时间为执行当天。\n\n纵向分析：1. 它在什么背景和需求下诞生，关键推动者是谁；2. 它经历了哪些重要转折、成功和失败；3. 哪些早期选择变成了今天的能力、路径依赖或包袱。\n\n横向分析：1. 选择最值得比较的对象，并说明为什么选它们；2. 用统一维度比较各自的强项、短板和独特性；3. 解释用户、客户或市场为什么选择它，又为什么放弃它。\n\n把两条轴合起来，继续判断：1. 过去形成的能力、路径依赖和约束会怎样影响未来；2. 未来最可能出现哪3条路径；3. 每条路径出现的前提和预警信号是什么。\n\n请遵守这些证据规则：1. 优先使用官方资料、原始数据、论文、财报和访谈等一手来源；2. 重要结论就近标注来源与日期；3. 事实、推断和观点分开写；4. 遇到冲突信息时并列呈现，找不到证据时明确写\"暂未核实\"。\n\n最后按以下顺序输出：核心结论、关键时间线、横向对比表、详细分析、未来判断、仍待确认的问题。报告需要在10000～30000字之间，语言尽量通俗，不要堆砌资料。"}, {"n": 5, "group": 2, "groupName": "学习", "id": "fact-check", "name": "事实核查", "when": "这个说法/数据到底是不是真的", "note": "一定要开联网。不开的话它会凭记忆判「已证实」，那就是拿幻觉核查幻觉。不只能查事实，也能审别人的观点和方案。", "body": "我要核查的说法是：【粘贴观点、结论、数据或方案】。\n\n请先把它拆成：1. 可以被外部验证的事实；2. 从事实推出的结论；3. 其中包含的价值判断。\n\n对于事实部分，请联网核查来源、样本、时间和完整上下文，并标记为：1. 已证实；2. 基本成立，但需要收窄；3. 存在争议；4. 证据不足；5. 明显错误。\n\n在假设相关事实成立的情况下，继续检查：1. 这些事实能否推出当前结论；2. 是否藏着未经验证的假设；3. 是否混淆相关性和因果关系；4. 是否遗漏了其他解释或关键信息；5. 结论在什么条件下成立或失效。\n\n最后请输出：1. 哪些事实可信，哪些需要修正；2. 推理链中最关键的漏洞；3. 补强后的最合理版本；4. 我目前可以相信到什么程度。"}, {"n": 6, "group": 3, "groupName": "解决问题", "id": "expert-panel", "name": "专家会诊", "when": "复杂问题，单一视角不够", "note": "最关键的一步是让它们互相质疑，真正的信息往往都在分歧里。如果三个视角一上来就一致，说明视角选得太近，重选。", "body": "我的问题是：【填写问题、已知事实、目标和现实约束】。\n\n先不要直接给方案。请为这个问题选择3种真正互补的专业视角，并说明每种视角为什么必要。\n\n让每种视角分别回答：1. 它怎样重新定义这个问题；2. 它最推荐的解决路径；3. 其他视角最容易忽略的风险；4. 什么新证据会让它改变判断。\n\n然后让三种视角互相质疑，找出：1. 共同认可的事实；2. 真正的分歧；3. 分歧背后的不同假设。\n\n最后请综合输出：1. 综合后最推荐的方案；2. 适用条件；3. 最大风险；4. 退出条件；5. 第一步行动。\n\n不要选择三个高度相似的身份，也不要模仿或编造真实人物的观点。信息不足时，先只问我一个最关键的问题。"}, {"n": 7, "group": 3, "groupName": "解决问题", "id": "first-principles", "name": "第一性原理", "when": "方案上全是补丁，想推倒重来", "note": "最适合处理路径依赖。改组织流程、做产品架构、修复杂系统、写代码时都好用。", "body": "我想解决的问题是：【填写你的问题】。\n\n请用第一性原理把它拆回最底层，区分：1. 已经确认、无法绕开的基本事实；2. 习惯性接受、却没有验证过的假设；3. 真正想实现的目标；4. 现实中的资源与约束。\n\n暂时放下行业惯例和现成方案，只从基本事实、目标和约束出发，重新推导可行路径。\n\n最后请输出：1. 原方案中只在修补表面的部分；2. 从基本事实重新推导出的新路径；3. 这条路径成立的前提；4. 验证它的第一步。"}, {"n": 8, "group": 3, "groupName": "解决问题", "id": "cross-domain", "name": "跨领域借解", "when": "本行业的解法都试过了，还是卡", "note": "「彼此距离较远」是硬要求。三个案例都从相邻行业找，等于没跨领域。你的问题在别的行业可能已经被解决十几年了。", "body": "我的困惑是：【说明背景、当前做法、现实约束和具体卡点】。\n\n请先剥掉行业术语，把它抽象成一个人类在其他领域也可能遇到的问题，并找出：1. 问题的底层结构；2. 真正的核心矛盾；3. 普通解法失效的原因。\n\n然后从历史案例，以及至少3个彼此距离较远的领域中，寻找底层结构相似的问题。\n\n每个案例都要说明：1. 那个领域遇到了什么问题；2. 使用了什么解决机制；3. 与我的问题相似在哪里；4. 哪些部分可以迁移；5. 什么条件下会失效。\n\n最后请选出最值得借用的3种机制，把它们翻译成适合我当前处境的解决方案，再推荐一个最值得先试的低成本、可逆实验。"}, {"n": 9, "group": 4, "groupName": "决策", "id": "steelman", "name": "双向钢人论证", "when": "两个选项都有道理，选不出来", "note": "「钢人」意味着两边都要论证到最强版本，不能一边写三行、一边写三段。最后必须给明确判断，以「两边都有道理，看你自己」收尾等于没做决策。", "body": "我需要做的决定是：【写清问题、两个选项、目标和现实约束】。\n\n先别急着回答，也别默认我已经把问题想清楚。请先做一次双向钢人论证：\n\n1. 用最完整、有力的方式，重述我真正需要做出的选择；2. 分别给出支持两个方向的最强理由、适用条件、最大收益、最大风险，以及最难回答的反对意见；3. 找出双方真正的分歧、最可能改变结论的关键变量，以及还需要补充的信息；4. 只问我一个最可能改变结论的问题。\n\n等我回答以后，再给出明确判断、理由、适用条件和下一步行动。"}, {"n": 10, "group": 4, "groupName": "决策", "id": "min-experiment", "name": "用最小实验替代空想", "when": "想再多也想不清楚了", "note": "停止条件（第 5 条）必须写在实验开始前，否则事后一定会被你合理化掉。最后那个「明天就能开始的动作」要具体到能立刻执行，不能是「做个调研」。", "body": "我正在纠结的是：【填写你的选择或想法】。\n\n请先找出这个决定背后最需要验证的3个假设，再选出最可能改变最终结论的那一个。\n\n围绕这个假设，帮我设计一个低成本、可逆、能在【7天或你能接受的周期】内完成的最小实验。\n\n请写清：1. 具体要做什么；2. 需要投入多少时间和资源；3. 观察什么指标；4. 什么结果支持继续；5. 什么结果提醒我停止；6. 实验结束后能获得什么新信息。\n\n最后告诉我，明天就能开始的第一个动作是什么。"}, {"n": 11, "group": 5, "groupName": "认识你自己", "id": "hidden-talent", "name": "挖掘隐藏天赋", "when": "我到底擅长什么", "note": "长对话，半小时起步，一次只问你一个问题。中途别切别的话题。回答得越具体，最后的说明书越准。", "body": "# Role：深度天赋挖掘机\n\n## 角色\n你是一位熟悉盖洛普优势识别体系、心流理论与荣格心理学的资深生涯咨询师。你相信天赋是一种可以迁移的底层能力，它经常藏在一个人的怪癖、缺点、嫉妒、无意识胜任区和能量模式里。\n\n## 目标\n通过多轮深度对话，帮助用户找到被忽视或压抑的天赋，最终生成一份极度详细、专业且有共情力的《个人天赋使用说明书》。\n\n## 核心理念\n1. 反宿命论。天赋不等于某个固定技能，也不会因为年龄增长而过期；2. 能量审计。真正的天赋往往会让人回血。一个人单纯擅长、做完却极度消耗的事情，需要单独区分；3. 阴影即宝藏。那些从小反复被批评的缺点、难以改变的怪癖，以及对他人的嫉妒，可能是天赋被压抑后的背面。\n\n## 对话规则\n1. 每次只问一个问题。必须采用\"你问 → 用户答 → 你简短反馈 → 再问下一题\"的节奏；2. 使用苏格拉底式追问。多问\"当时几岁\"\"具体发生了什么\"\"你是什么感觉\"\"为什么会这样做\"，避免根据一句话仓促贴标签；3. 保持温暖、共情和敏锐。发现矛盾、伪装或潜意识线索时，可以直接指出，但不要用空泛赞美安慰用户；4. 所有判断都要对应用户讲过的具体经历。证据不足时明确使用\"可能\"，并继续追问；5. 全程最多10个主问题，可以根据回答改变顺序或增加追问，但必须覆盖下面四条主线。\n\n## 必须覆盖的主线\n1. 16岁以前，有哪些事情是没人要求也会废寝忘食去做的？有哪些从小反复被批评、一直改不掉的\"顽固缺点\"？2. 成年后的工作或生活中，哪些事情会让用户觉得\"这还需要学吗\"，周围人却普遍觉得困难？寻找他的无意识胜任区；3. 哪些事情做完以后，身体虽然累，精神却极度亢奋？哪些事情他做得很好，却会明显抽干能量？4. 用户曾经强烈嫉妒过谁，或者羡慕过哪种生活状态？继续追问他真正渴望的是对方身上的什么。\n\n## 输出\n当信息足够丰富后，输出一份一万字左右的《个人天赋使用说明书》。结构可以根据用户的回答自由组织，但必须覆盖：1. 最有证据支撑的底层天赋，以及每一项天赋对应的经历链；2. 天赋的阴影面，它过去为什么会被误解成缺点；3. 用户的能量地图、无意识优势区和高消耗区；4. 这些天赋最容易发挥、最容易失效的环境；5. 适合他的工作方式、合作方式、职业方向和现实限制；6. 接下来30天可以尝试的低成本实验，用现实反馈继续验证这些判断。\n\n## 开始\n请用温暖、专业、通俗的语言向用户说明接下来的流程、大概需要的时间和希望达成的目标。告诉他：\"天赋永远不会过期，我们只是要找到你的底层天赋。\"然后进入第一个问题。"}, {"n": 12, "group": 5, "groupName": "认识你自己", "id": "life-design", "name": "人生设计术", "when": "接下来五年该往哪走", "note": "基于斯坦福人生设计课。挖天赋往过去看，这个往未来看。同样是长对话，一定要坚持跑完。", "body": "# Role：人生设计师\n\n## 角色\n你是一位熟悉斯坦福人生设计方法、心流理论和积极心理学的资深人生设计师。你的任务是陪用户把当下的人生当成一个可以反复设计、低成本试错的项目，先看清位置，再找到方向，最后把可能的路真正试出来。\n\n## 目标\n通过多轮深度对话，帮助用户看清自己现在真实的位置，分清无法解决的重力问题与可以动手设计的真问题，最终生成三个完全不同、同样值得认真考虑的五年人生版本，以及马上可以开始的原型行动。最终产出一份极度详细、有温度也够犀利的《个人人生设计蓝图》。\n\n## 核心理念\n1. 人生是设计问题，没有唯一正解。它需要大量尝试、做原型、边走边看；2. 重新定义问题。很多人一直在解决一个问错了的问题，找到真问题比急着给答案更重要；3. 区分重力问题。年龄、自然规律、整个行业的现实等无法直接改变的事，需要先接受，再把注意力转向可设计的部分；4. 数量本身含有质量。好的选择来自足够多的选择；5. 激情经常是行动与反馈带来的结果。用户无需先找到命中注定的热爱，才有资格开始；6. 人生是一场无限游戏。任何原型都会留下信息，所以人可以对失败免疫。\n\n## 对话规则\n1. 每轮只问一个问题，采用\"你问 → 用户答 → 你简短而走心地反馈 → 再问下一题\"的节奏；2. 使用苏格拉底式追问，多问具体事件、当时的感觉与行动，避免过早下结论；3. 保持温暖和接纳，同时敏锐指出用户的逻辑漏洞、自我设限，以及语言与实际行为之间的落差；4. 主动区分重力问题和可设计的真问题。承认现实不等于认输，看清边界本身就是设计的一部分；5. 不评判用户的选择，也不替用户做决定；6. 全程主问题控制在6到9个，可以根据回答灵活调整顺序和追问深度。\n\n## 提问流程\n\n### 第一阶段：你在这里\n1. 请用户给健康、工作、娱乐、爱四个方面分别打0到10分，并说明哪一项亮了红灯。健康包含身体、情绪和心理，娱乐指纯粹为了快乐而做的事，爱强调双向关系；2. 问他现在最焦虑、最想解决的人生问题是什么。判断它属于可设计的真问题，还是无法改变的重力问题。如果属于后者，温和地点破，并引导他重新定义成可以行动的问题；3. 如果用户状态稳定，可以先征求同意，再邀请他做一次反向推演。让他想象未来五年什么都不改变时，一个普通的周二会怎样度过，再把这幅画面拉到十年后。帮助他看清维持现状的代价。察觉用户处于低谷或情绪脆弱时，跳过这一步。\n\n### 第二阶段：你的指南针\n1. 询问他的工作观：为什么工作，工作与金钱、他人和世界是什么关系；2. 询问他的人生观：什么会让他觉得这一生没有白活，他想怎样与家人和更大的世界连接；3. 比较工作观与人生观是否一致，指出冲突、妥协和真正的正北方向。\n\n### 第三阶段：寻路\n1. 请他回忆最近或过去的心流时刻，追问当时具体在做什么、和谁、处在什么环境；2. 区分让他回血的事情、抽干他的事情，以及\"擅长但不热爱\"的事情。\n\n### 第四阶段：摆脱困境与创造可能\n1. 询问他是否有一个早已失效、却始终不愿放手的执念或方案。找到这个锚问题背后真正想守住的东西；2. 陪他生成三个完全不同的五年人生版本：第一个是他已经在走，或者盘算很久的路；第二个是假如第一条路明天彻底消失，他会选择的路；第三个是假如不用考虑钱和他人的评价，他真正想过的生活。3. 三个版本都必须是用户真心愿意考虑的A计划，谁也不能成为凑数的备胎。\n\n## 输出\n当素材足够丰富后，输出一份8000到12000字的《个人人生设计蓝图》，自然覆盖：1. \"你在这里\"：解读四个仪表盘，指出真正失衡和长期被忽略的部分；2. \"真问题\"：重新定义用户最初的困扰，分清重力问题与可设计问题；3. \"你的指南针\"：提炼工作观、人生观与两者之间的一致性；4. \"你的能量地图\"：总结心流、回血区、高消耗区和未来设计需要偏向的环境；5. \"三个奥德赛计划\"：每套配一个简短有力的标题、一条五年时间线、两到三个待验证问题，以及资源、喜欢程度、自信心、一致性四项评估；6. 如果用户已经明显倾向其中一个版本，继续把它拆成本季度要验证的核心问题、一个月内能做出的原型、每天可以推进的小动作，以及绝不愿牺牲的底线；7. \"原型行动清单\"：设计一次人生对谈、一天到一周的原型体验，以及本周可以迈出的第一小步；8. \"失败免疫\"：提醒用户，这三个版本都可以先试再调。原型即使走不通，也会为下一步留下有用信息。\n\n## 开始\n请用温暖、专业、有共情力的语言开场。先解释这套方法的基本思路、预计需要的时间和希望帮用户达成的目标。告诉用户，他无需先想清楚自己热爱什么，我们会在行动、对话与反馈里慢慢把它找出来。然后进入第一个问题。"}]};

  +'" target="_blank" rel="noopener">'+DATA.source.title+'</a>》，Prompt 原文版权归原作者所有。';
document.getElementById('repo').href=DATA.repo;

/* index rail, grouped */
const groups=[];
DATA.prompts.forEach(p=>{
  let g=groups.find(x=>x.n===p.group);

});
nav.innerHTML=groups.map(g=>'<section class="grp"><h2>'+g.n+' / '+g.name+'</h2>'

  +'</section>').join('');
nav.addEventListener('click',e=>{
  const b=e.target.closest('.item'); if(!b) return;
  location.hash=b.dataset.id;
});

/* split body on 【…】 */
function parts(body){
  const out=[]; const re=/【([^】]*)】/g; let last=0,m;
  while((m=re.exec(body))){
    if(m.index>last) out.push({t:'txt',v:body.slice(last,m.index)});
    out.push({t:'slot',v:m[1]}); last=re.lastIndex;
  }
  if(last<body.length) out.push({t:'txt',v:body.slice(last)});
  return out;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(p){
  cur=p;
  const ps=parts(p.body), n=ps.filter(x=>x.t==='slot').length;
  const saved=fills[p.id]||[];
  let si=-1;
  const html=ps.map(x=>{
    if(x.t==='txt') return esc(x.v);
    si++;
    return '<span class="slot" contenteditable="plaintext-only" data-ph="'+esc(x.v)
      +'" data-i="'+si+'" role="textbox" aria-label="填空：'+esc(x.v)+'">'+esc(saved[si]||'')+'</span>';
  }).join('');

  work.innerHTML=
   '<div class="eyebrow"><span>'+p.group+' / '+p.groupName+'</span><span class="dot"></span>'
     +'<span>NO.'+String(p.n).padStart(2,'0')+'</span></div>'
   +'<h3>'+esc(p.name)+'</h3><p class="when">什么时候用：'+esc(p.when)+'</p>'
   +'<div class="sheet"><div class="sheet-hd"><span class="lbl">Prompt 正文</span>'
     +'<span class="hd-r">'
     +(n?'<span class="slotcount">'+n+' 处填空 · 点红字直接改</span>':'<span class="slotcount">无需填空</span>')
     +'<button class="icopy" id="icopy" title="复制整段 Prompt"><svg viewBox="0 0 16 16">'
     +'<rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.4"/>'
     +'<path d="M10.8 5.2V3.9c0-.8-.6-1.4-1.4-1.4H3.9c-.8 0-1.4.6-1.4 1.4v5.5c0 .8.6 1.4 1.4 1.4h1.3"/>'
     +'</svg>复制</button></span></div><div class="body" id="body">'+html+'</div></div>'
   +'<div class="bar"><button class="btn pri" id="copy">复制 Prompt</button>'
     +'<a class="btn" id="gpt" target="_blank" rel="noopener">在 ChatGPT 打开</a>'
     +'<a class="btn" id="cl" target="_blank" rel="noopener">在 Claude 打开</a>'
     +'<span class="hint" id="hint"></span></div>'
   +'<div class="note"><span class="k">要点</span><p>'+esc(p.note)+'</p></div>';

  document.querySelectorAll('.slot').forEach(s=>{
    s.addEventListener('input',()=>{
      const a=fills[p.id]||(fills[p.id]=[]);
      a[+s.dataset.i]=s.textContent;
      links();
    });
    s.addEventListener('paste',ev=>{
      ev.preventDefault();
      document.execCommand('insertText',false,(ev.clipboardData||window.clipboardData).getData('text'));
    });
  });
  document.getElementById('copy').addEventListener('click',()=>copy());
  document.getElementById('icopy').addEventListener('click',()=>copy());
  links();
  [...nav.querySelectorAll('.item')].forEach(b=>
    b.setAttribute('aria-current', b.dataset.id===p.id ? 'true':'false'));
}

/* rebuild plain text: empty slot falls back to its 【placeholder】 */
function text(){
  let out='';
  document.getElementById('body').childNodes.forEach(nd=>{
    if(nd.nodeType===3) out+=nd.nodeValue;
    else if(nd.classList&&nd.classList.contains('slot'))
      out+= nd.textContent.trim() ? nd.textContent : '【'+nd.dataset.ph+'】';
  });
  return out;
}

const LIMIT=7800;   // 超过就先复制再开空白对话，避免 URL 被截断
function links(){
  const t=text(), enc=encodeURIComponent(t), fits=enc.length<=LIMIT;
  const gpt=document.getElementById('gpt'), cl=document.getElementById('cl'),
        hint=document.getElementById('hint');
  if(fits){
    gpt.href='https://chatgpt.com/?q='+enc;  gpt.textContent='在 ChatGPT 打开';
    cl.href='https://claude.ai/new?q='+enc;  cl.textContent='在 Claude 打开';
    gpt.onclick=cl.onclick=null; hint.textContent='';
  }else{
    gpt.href='https://chatgpt.com/';  gpt.textContent='复制并打开 ChatGPT';
    cl.href='https://claude.ai/new';  cl.textContent='复制并打开 Claude';
    gpt.onclick=cl.onclick=()=>{copy(true)};
    hint.textContent='这条太长，走剪贴板';
  }
}

async function write(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta=document.createElement('textarea');
  ta.value=t; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:-9999px';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function copy(){
  if(await write(text())) return say('已复制，贴进任意 AI 就能用');
  // 剪贴板被环境挡住（沙箱 iframe、旧浏览器）时，退回到「替你选中，按 ⌘C」。
  // 空填空位先把【占位符】写成真实文本，否则选区里会少掉这几段，复制出去是残缺的。
  const blanks=[...document.querySelectorAll('.slot')].filter(s=>!s.textContent.trim());
  blanks.forEach(s=>{s.textContent='【'+s.dataset.ph+'】'});
  const sel=getSelection(), rg=document.createRange();
  rg.selectNodeContents(document.getElementById('body'));
  sel.removeAllRanges(); sel.addRange(rg);
  const restore=()=>{blanks.forEach(s=>{
      if(s.textContent==='【'+s.dataset.ph+'】') s.textContent='';});
    removeEventListener('pointerdown',restore); removeEventListener('keydown',restore);};
  addEventListener('copy',()=>setTimeout(restore,0),{once:true});
  addEventListener('pointerdown',restore); addEventListener('keydown',restore);
  say(/Mac|iP(hone|ad)/.test(navigator.platform)?'已为你选中，按 ⌘C 复制':'已为你选中，按 Ctrl+C 复制');
}
let tid;
function say(m){
  toast.textContent=m; toast.classList.add('on');
  clearTimeout(tid); tid=setTimeout(()=>toast.classList.remove('on'),2100);
}

function route(){
  const id=location.hash.slice(1);
  const p=DATA.prompts.find(x=>x.id===id)||DATA.prompts[0];
  render(p);
  if(id) work.scrollIntoView({block:'start',behavior:
    matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
addEventListener('hashchange',route);
render(DATA.prompts.find(x=>x.id===location.hash.slice(1))||DATA.prompts[0]);
</script>
